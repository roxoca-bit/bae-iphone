.phone-recent{overflow:auto;flex:1;min-height:0;scrollbar-width:none;padding:4px 15px 16px}
.phone-recent::-webkit-scrollbar{display:none}
.phone-call{width:100%;display:flex;align-items:center;gap:12px;min-height:78px;text-align:left;border:0;background:white;padding:10px 1px;color:inherit}
.phone-person-avatar{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(#bdcfe8,#7f90c1);overflow:hidden}
.phone-person-avatar svg{height:43px;width:43px;fill:white}
.phone-call-main{display:flex;flex-direction:column;justify-content:center;gap:3px;flex:1;min-width:0;min-height:70px;border-bottom:1px solid #ededed;padding:8px 0}
.phone-call-name{font-size:17px;font-weight:750;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#111}
.phone-call-name.missed{color:#e34242}
.phone-call-sub{font-size:13px;color:#939393;white-space:nowrap}
.phone-call-side{display:flex;align-items:center;gap:9px;flex-shrink:0;color:#969696;font-size:13px}
.phone-call-phone{height:40px;width:40px;display:grid;place-items:center;border-radius:50%;background:#f4f4f5;color:#3186f7}
.phone-call-phone svg{width:20px;height:20px;fill:currentColor}
.phone-footer{display:flex;justify-content:space-around;gap:8px;margin:0 15px calc(env(safe-area-inset-bottom) + 10px);padding:9px 8px 7px;border-radius:30px;background:rgba(248,248,249,.97);flex-shrink:0}
.phone-footer button{flex:1;border:0;background:transparent;color:#888;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:6px}
.phone-footer button.active{color:#3088f8}.phone-footer button svg{width:24px;height:24px}
.phone-info-pane{flex:1;padding:25px;overflow:auto;color:#777}
@media(max-width:370px){.phone-call{gap:8px}.phone-call-side{gap:4px;font-size:12px}.phone-person-avatar{width:47px;height:47px}.phone-call-name{font-size:16px}}

/* 연락처와 비활성 키패드 */
.phone-contacts{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 12px;background:#fff}
.phone-contact-row{display:flex;align-items:center;gap:14px;min-height:77px;border-bottom:1px solid #e9e9eb;color:#111;font-size:17px;font-weight:500}
.phone-contact-row .phone-person-avatar{height:49px;width:49px;flex:0 0 49px}
.phone-keypad{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 10px 12px;background:#fff}
.phone-dial-display{height:58px;flex-shrink:1}
.phone-key-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;width:min(100%,315px);margin:0 auto}
.phone-key{width:100%;aspect-ratio:1;max-height:100px;border-radius:50%;background:#f7f7f8;border:1px solid #f5f5f5;box-shadow:0 4px 14px rgba(0,0,0,.025);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000;user-select:none;cursor:default}
.phone-key span{font-size:42px;line-height:1.12;font-weight:350}
.phone-key small{font-size:10px;letter-spacing:2px;font-weight:700;height:13px}
.phone-dial-call{height:76px;width:76px;border-radius:50%;background:#61cc66;display:flex;align-items:center;justify-content:center;margin-top:21px;flex-shrink:0;cursor:default}
.phone-dial-call svg{height:34px;width:34px;fill:#fff}
@media(max-height:720px){.phone-key-grid{width:min(100%,258px);gap:8px 15px}.phone-key span{font-size:34px}.phone-dial-display{height:20px}.phone-dial-call{height:62px;width:62px;margin-top:12px}}
.exchange-readonly{font-family:inherit;font-size:15px;line-height:1.9;color:#333;white-space:pre-wrap;overflow-wrap:anywhere;min-height:250px;background:repeating-linear-gradient(white,white 33px,#f5f0ed 34px);padding:3px 0;user-select:text}

let seulgiAudio=null;
function playSeulgiVoice(button){
  if(!seulgiAudio){
    seulgiAudio=new Audio(SEULGI_AUDIO);
    for(const name of ['ended','pause'])seulgiAudio.addEventListener(name,()=>{document.querySelectorAll('.voice-btn.playing').forEach(b=>{if(b.dataset.voice==='seulgi'){b.classList.remove('playing');b.firstChild.textContent='▶ ';}})});
  }
  if(!seulgiAudio.paused){seulgiAudio.pause();seulgiAudio.currentTime=0;return;}
  if(juhyeonAudio&&!juhyeonAudio.paused)juhyeonAudio.pause();
  seulgiAudio.currentTime=0;
  seulgiAudio.play().then(()=>{button.classList.add('playing');button.dataset.voice='seulgi';button.firstChild.textContent='Ⅱ ';}).catch(()=>alert('음성을 재생할 수 없습니다.'));
}
let juhyeonAudio=null;
function playJuhyeonVoice(button){
  if(!juhyeonAudio){
    juhyeonAudio=new Audio(JUHYEON_AUDIO);
    juhyeonAudio.addEventListener('ended',()=>{document.querySelectorAll('.voice-btn.playing').forEach(b=>{b.classList.remove('playing');b.firstChild.textContent='▶ ';});});
    juhyeonAudio.addEventListener('pause',()=>{document.querySelectorAll('.voice-btn.playing').forEach(b=>{b.classList.remove('playing');b.firstChild.textContent='▶ ';});});
  }
  if(!juhyeonAudio.paused){juhyeonAudio.pause();juhyeonAudio.currentTime=0;return;}
  if(seulgiAudio&&!seulgiAudio.paused)seulgiAudio.pause();
  juhyeonAudio.currentTime=0;
  juhyeonAudio.play().then(()=>{button.classList.add('playing');button.firstChild.textContent='Ⅱ ';}).catch(()=>alert('음성을 재생할 수 없습니다.'));
}

function shouldShowTime(messages,index){const cur=messages[index];if(!cur||cur.type==='date'||!cur.time)return false;const next=messages[index+1];if(!next||next.type==='date')return true;return !(next.mine===cur.mine&&next.time===cur.time)}
function isFirstSenderMessage(messages,index){const m=messages[index];if(!m||m.mine||m.type==='date')return false;const prev=messages[index-1];if(!prev||prev.type==='date'||prev.mine!==m.mine)return true;const a=prev.time?.split(':').map(Number),b=m.time?.split(':').map(Number);if(!a||!b)return true;const gap=(b[0]*60+b[1])-(a[0]*60+a[1]);return gap<0||gap>10}

function friendAvatar(name){if(name==="배주현"||name==="나")return `<img src="${JUHYEON_AVATAR}" alt="">`;if(["고3 현진쌤","손승완","서주현"].includes(name))return `<img src="${COMMON_BLUE_AVATAR}" alt="">`;if(name==="엄마")return `<img src="${MOM_AVATAR}" alt="">`;const normalized=name.replace(/\s+/g,"");const found=data.chats.find(c=>c.name.replace(/\s+/g,"")===normalized&&c.avatar);if(found)return `<img src="${esc(found.avatar)}" alt="">`;return `<svg viewBox="0 0 60 60" aria-hidden="true" class="friend-default"><circle cx="30" cy="22" r="11"/><path d="M11 55c0-14 8-22 19-22s19 8 19 22Z"/></svg>`}
function renderFriends(){kakaoTab='friends';put(`<div class="kakao-shell"><div class="kakao-heading friends-heading"><h1>친구</h1><div class="heading-icons"><span>⌕</span><span>♙+</span><span>♫</span><span>⚙</span></div></div><div class="chat-rows friends-list"><div class="my-profile"><div class="kakao-avatar">${friendAvatar("배주현")}</div><div><strong>배주현</strong></div></div><div class="friend-section-title">친구 ${kakaoFriends.length}</div>${kakaoFriends.map(n=>`<button class="friend-row" onclick="openFriend('${n}')"><div class="kakao-avatar">${friendAvatar(n)}</div><span>${n}</span></button>`).join('')}</div>${kakaoBottom()}</div>`)}
function openFriend(name){if(name==='강슬기'){kakaoTab='chats';chatRoom(0)}else if(name==='고3 현진쌤'){kakaoTab='chats';chatRoom(data.chats.findIndex(c=>c.id==='go3-hyeonjin'))}else alert(name+' 채팅방은 나중에 추가할 예정이야.')}
function openChatFromList(i){if(!data.chats[i]?.locked)chatRoom(i)}
function renderChats(){kakaoTab='chats';put(`<div class="kakao-shell"><div class="kakao-heading"><h1>채팅</h1><span>⌕ &nbsp; ♧ &nbsp; ⚙</span></div><div class="kakao-tabs"><b>전체</b><span>안 읽음</span><span>오픈채팅</span></div><div class="chat-rows">${data.chats.map((c,i)=>`<button class="kakao-row" onclick="openChatFromList(${i})"><div class="kakao-avatar ${c.id==='go3-hyeonjin'?'teacher-avatar':''}">${c.avatar?`<img src="${esc(c.avatar)}">`:`<span class="default-person">●<small>◕</small></span>`}</div><div class="kakao-person"><strong>${esc(c.name)}</strong><span>${esc(c.preview||c.messages?.at(-1)?.text||'대화 내용이 없습니다.')}</span></div><div class="kakao-meta"><small>${esc(c.time||'')}</small>${c.unread?`<em>${esc(c.unread)}</em>`:''}</div></button>`).join('')}</div>${kakaoBottom()}</div>`)}

function showChatPhoto(){const w=document.createElement('div');w.className='photo-lightbox';w.innerHTML=`<button aria-label="닫기" onclick="this.parentElement.remove()">×</button><img src="${SEULGI_SELFIE}" alt="강슬기 사진">`;document.body.appendChild(w)}
function chatRoom(i){const c=data.chats[i];put(`<div class="kakao-room"><div class="room-header"><button class="room-back" aria-label="채팅 목록으로 돌아가기" onclick="renderChats()">‹</button><strong>${esc(c.name)}</strong><span class="room-header-actions">⌕ &nbsp; ☎ &nbsp; ☰</span></div><div class="room-scroll">${(c.messages||[]).map((m,j)=>m.type==='date'?`<div class="chat-date"><span>${new Date(m.date+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})} ›</span></div>`:`<div class="room-message ${m.mine?'mine':''} ${!m.mine&&!isFirstSenderMessage(c.messages,j)?'grouped':''}">${m.mine?'':`<div class="room-avatar ${c.id==='go3-hyeonjin'?'teacher-avatar':''} ${isFirstSenderMessage(c.messages,j)?'':'avatar-space'}">${isFirstSenderMessage(c.messages,j)?roomAvatarHTML(c):''}</div>`}<div class="room-msgcontent">${!m.mine&&isFirstSenderMessage(c.messages,j)?`<span class="room-sender">${esc(c.name)}</span>`:''}<div class="room-bubblewrap"><div class="room-bubble">${m.type==='voice'?`<button class="voice-btn" aria-label="음성 메시지 ${esc(m.duration)}" onclick="${m.mine&&m.duration==='0:04'?'playJuhyeonVoice(this)':(!m.mine&&m.duration==='0:10'?'playSeulgiVoice(this)':"alert('음성 파일은 추후 추가됩니다.')")}">▶ <span>${esc(m.duration)}</span></button>`:m.text&&m.text.startsWith('[사진:')?`<img class="kakao-chat-photo" src="${SEULGI_SELFIE}" alt="강슬기가 보낸 셀카" onclick="showChatPhoto()">`:esc(m.text)}</div>${(shouldShowTime(c.messages,j)||m.unread)?`<span class="room-time">${m.unread?'<b>1</b>':''}${shouldShowTime(c.messages,j)?fmtChatTime(m.time):''}</span>`:''}</div></div></div>`).join('')}</div><div class="room-compose"><span>＋</span><div class="fake-compose">메시지 입력</div><span>☺</span><span>＃</span></div></div>`);const sc=document.querySelector('.room-scroll');if(sc)sc.scrollTop=sc.scrollHeight}
function fmtChatTime(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}:${String(m).padStart(2,'0')}`}
function renameChat(i){const n=prompt('대화 상대',data.chats[i].name);if(n&&n.trim()){data.chats[i].name=n.trim();save();renderChats()}}
function sendChat(i,mine){const t=val('chatText').trim();if(!t)return;data.chats[i].messages.push({mine,text:t});save();chatRoom(i)}
function editMessage(i,j){const t=prompt('대화 수정',data.chats[i].messages[j].text);if(t===null)return;data.chats[i].messages[j].text=t;save();chatRoom(i)}
let instaTab='profile',instaPostIndex=0;
function renderInsta(){const ps=data.posts||[];const name=esc(data.instaId||'juhyeon');put(`<div class="insta-shell"><div class="insta-bar"><button onclick="instaTab='profile';renderInsta()">${instaTab==='post'?'‹':''}</button><strong>${instaTab==='post'?'게시물':name+'⌄'}</strong><span>＋ &nbsp; ☰</span></div>${instaTab==='profile'?`<div class="ig-profile"><div class="ig-profile-top"><div class="ig-avatar">${data.profileImage?`<img src="${esc(data.profileImage)}">`:'♡'}</div><div class="ig-stats"><div><b>${ps.length}</b><span>게시물</span></div><div><b>${esc(data.followers||'0')}</b><span>팔로워</span></div><div><b>${esc(data.following||'0')}</b><span>팔로잉</span></div></div></div><div class="ig-bio"><strong>${esc(data.name)}</strong><p>${esc(data.instaBio||'')}</p></div><div class="ig-actions"><button>프로필 편집</button><button>프로필 공유</button><button class="ig-person">♙</button></div><div class="ig-highlights">${(data.highlights||[]).map(h=>`<div onclick="openStory('${esc(h.title)}')"><div class="ig-highlight">${h.image?`<img src="${esc(h.image)}">`:'♡'}</div><span>${esc(h.title)}</span></div>`).join('')}</div></div><div class="ig-grid-tabs"><b>▦</b><span>▧</span><span>♧</span></div><div class="ig-grid">${ps.map((p,i)=>`<button onclick="instaPostIndex=${i};instaTab='post';renderInsta()">${p.image?`<img src="${esc(p.image)}">`:'<div class="ig-placeholder">♡</div>'}</button>`).join('')}</div>`:`<div class="ig-feed">${ps[instaPostIndex]?`<div class="ig-feed-author"><div class="ig-miniavatar">♡</div><strong>${name}</strong><span>···</span></div>${ps[instaPostIndex].image?`<img class="ig-feed-photo" src="${esc(ps[instaPostIndex].image)}">`:'<div class="ig-feed-photo ig-placeholder">♡</div>'}<div class="ig-reactions">♡ &nbsp; ♧ &nbsp; ➤ <span>▢</span></div><p><strong>${name}</strong> ${esc(ps[instaPostIndex].caption||'')}</p><div class="ig-comment">댓글 보기</div>`:'<p>게시물이 없습니다.</p>'}</div>`}<div class="ig-nav"><button onclick="instaTab='profile';renderInsta()">⌂</button><button onclick="instaTab='profile';renderInsta()">⌕</button><button>⊞</button><button>♡</button><button onclick="instaTab='profile';renderInsta()">◉</button></div></div>`)}
function openStory(title){alert(title+' 스토리 콘텐츠는 추후 추가할 수 있어요.')}
function editProfile(){let n=prompt('이름',data.name);if(n===null)return;let u=prompt('아이디',data.instaId);if(u===null)return;let b=prompt('소개글',data.instaBio);if(b===null)return;data.name=n;data.instaId=u;data.instaBio=b;save();renderInsta()}
function editPost(i){const n=prompt('게시물 설명 (비우면 삭제)',data.posts[i].caption);if(n===null)return;if(!n.trim())data.posts.splice(i,1);else data.posts[i].caption=n;save();renderInsta()}
function readImage(file,callback){if(!file)return callback('');if(file.size>2500000){alert('2.5MB 이하 이미지를 사용해 주세요.');return}const fr=new FileReader();fr.onload=()=>callback(fr.result);fr.readAsDataURL(file)}
function addPost(){readImage(document.querySelector('#postFile').files[0],img=>{data.posts.unshift({image:img,caption:val('caption')});save();renderInsta()})}
function renderNotes(){put(`<div class="panel"><h3>메모</h3><button class="primary" onclick="newNote()">＋ 새로운 메모</button></div>${data.notes.map((n,i)=>`<div class="note-row" onclick="openNote(${i})"><strong>${esc(n.title||'제목 없음')}</strong><div class="subtle">${esc(n.body.slice(0,75))}</div></div>`).join('')}`)}function newNote(){data.notes.unshift({id:Date.now(),title:'',body:''});save();openNote(0)}function openNote(i){let n=data.notes[i];put(`<div class="panel">${input('noteTitle','제목',n.title)}<textarea id="noteBody" class="textarea" style="min-height:48vh" placeholder="메모를 작성하세요">${esc(n.body)}</textarea><div class="tabs"><button class="primary" onclick="data.notes[${i}].title=val('noteTitle');data.notes[${i}].body=val('noteBody');save();renderNotes()">저장</button><button class="secondary" onclick="if(confirm('메모를 삭제할까요?')){data.notes.splice(${i},1);save();renderNotes()}">삭제</button><button class="secondary" onclick="renderNotes()">목록</button></div></div>`)}
function renderCalendar(){const date=new Date().toLocaleDateString('en-CA');put(`<div class="panel"><h3>일정</h3>${data.events.map((e,i)=>`<div class="list-row"><span><strong>${esc(e.title)}</strong><br><small>${esc(e.date)}</small></span><button class="secondary" style="margin-left:auto" onclick="data.events.splice(${i},1);save();updateClock();renderCalendar()">삭제</button></div>`).join('')}<h3>일정 추가</h3>${input('eventDate','날짜',date,'date')}${input('eventTitle','일정 이름')}<button class="primary" onclick="if(val('eventTitle')){data.events.push({date:val('eventDate'),title:val('eventTitle')});save();updateClock();renderCalendar()}">등록</button></div>`)}function renderAI(){put(`<div class="panel"><h3>Chat AI</h3><p class="subtle">소설용 가상 AI 채팅입니다. 실제 AI 서버는 연결되지 않습니다.</p>${data.ai.map((m,i)=>`<div class="chat-bubble ${m.mine?'mine':''}" style="background:${m.mine?'#ddf5ef':'#eee'};max-width:95%" onclick="editAI(${i})">${esc(m.text)}</div>`).join('')}<div class="composer">${input('aiText','메시지 입력')}<button class="primary" onclick="sendAI()">보내기</button></div><button class="secondary" onclick="data.ai=[];save();renderAI()">대화 지우기</button></div>`)}function sendAI(){let t=val('aiText').trim();if(!t)return;data.ai.push({mine:true,text:t},{mine:false,text:'이것은 배주현의 소설 속 Chat AI입니다. 아래 답변을 눌러서 원하는 내용으로 수정해 주세요.'});save();renderAI()}function editAI(i){let x=prompt('대화 수정',data.ai[i].text);if(x===null)return;if(x==='')data.ai.splice(i,1);else data.ai[i].text=x;save();renderAI()}
const exchangeDates=['2026.10.13','2026.10.14','2026.10.16','2026.10.18','2026.10.21','2026.10.23','2026.10.24','2026.10.26'];
const defaultExchangeEntries={"2026.10.13":{"seulgi":"주현이가 칼답을 하라고 화낸다 ㅠㅠ 나는 원래 답장이 느리다. 근데 그래도 주현아 네 건 정말 빨리 보는 편이야 이해해줘. 수능이 다가올수록 엄청 부담되고 힘든데 그래도 공부가 재밌다. 나는 공부체질인가보다ㅎㅎ","juhyeon":"강슬기가 셀카를 보냈다. 너는 집에서 화장도 안 하고 찍었는데 진짜 예쁘네. 나는 화장 안 하고 찍으면 별로인 것 같던데… 아닌가. 모르겠다. 집에서 뒹굴거리다가 떡볶이 시켜먹을까 고민하다가 그냥 말았다. 요즘 입맛이 없다."},"2026.10.14":{"seulgi":"오늘 진짜 피곤한 날이었다. 왜냐하면 학원 숙제가 너무 많았기 때문이었다. 10월에 마지막으로 역량 평가가 있어서 그거 준비하느라 진짜 바쁘다. 곧 시험인데 스트레스가 장난 아니라 텐동집 가서 두그릇 먹었다. 히히 역시 먹을 때가 제일 행복하다.","juhyeon":"박수영이 손승완이라는 애랑 썸을 타고 있다고 한다. 손승완은 강슬기 친구 아닌가? 걔네 둘은 어떻게 친한 거지. 여고에서 여자 사귀는게 흔한 일이긴 한데 대체 어떻게 만나는 건지 궁금하다 ㅋㅋㅋ 요즘 궁금한게 많다. 아 그리고 슬기야 오늘 하늘 봤어? 엄청 예쁘더라. 너만큼 ㅎㅎ"},"2026.10.16":{"seulgi":"주현이는 추운데 왜 옷을 춥게 입고 다닐까. ㅋㅋㅋㅋ 배주현 옷 좀 따뜻하게 입고 다녀. 아 그리고 오늘은 가족들이랑 오랜만에 외식을 했다. 대학 얘기가 안 나오진 않았는데 부담주려고 하는 분위기는 아니라서 다행이었다. 내가 나를 더 의식하고 부담주는 것 같아서 힘든 요즘이다 ㅠㅠ 고3이 뭐 그런 거겠지. 그치만 요즘 왜인지 모르게 힘이 난다. 이상하다.","juhyeon":"으으으으 곰팡이 먹는 강슬기. 한줌쏙 뜻도 모르는 강슬기. 너 완전 바보 멍청이야 알아? 나는 오늘 생각이 너무너무 많은 날이었어…. 박수영이랑 손승완이랑 사귀는 것 같아. 아닌 것 같기도 하고. 근데 고3이면 이제 대학도 가고 떨어질텐데 연애가 되나…. 모르겠다. 내가 너무 오지랖인가보다. 걔들이 알아서 하겠지~"},"2026.10.18":{"seulgi":"주현이랑 떡볶이를 먹고 왔다. 날씨가 점점 추워지고 있다. 감기 조심해 주현아!","juhyeon":"그게 끝이냐? 나도 오늘은 안 쓸래 잘자라 ㅡㅡ"},"2026.10.21":{"seulgi":"주현이랑 학교 끝나고 영화관에 가서 영화를 봤다. 어디서 그런 걸 구해오는지 19금 영화를 예매해왔다. 그런 건 어떻게 하는 걸까? 진짜 신기하다. 근데 나도 그런 일탈을 하니까 재미있었다. 좋은 경험이다. 주현이랑 친해질 줄 몰랐는데 주현이랑 친해지니까 이런저런 경험을 많이 해보게 된다.","juhyeon":"강슬기는 완전 애기다. 애기. 19금 영화 보면서 소리지르는 애기. 그렇게 야한 것도 아닌데 자기 혼자 얼굴 빨개져서 온갖 상상을 다 한다. 어른들은 그런 애들이 더 변태 같다는데 그런거 아닌가 몰라~ 근데 이런 일탈이 처음이래서 귀여웠다."},"2026.10.23":{"seulgi":"친구들이랑 배드민턴을 치고 왔다. 오랜만에 땀흘리니까 스트레스도 풀리고 좋다 ㅎㅎ 바깥 공기가 선선하고 날씨도 좋았다. 음료 한잔 마시니까 진짜 너무 좋았다. 공부 안 하는 날도 필요한 것 같다.","juhyeon":"오늘 진짜 학교 가기 싫었는데 너 때문에 간 거다. 난 이제 술 마시러 감."},"2026.10.24":{"seulgi":"아까 보니까 몸 조금 안 좋은 것 같은데 약 먹고 간식도 먹고 밥도 잘 챙겨먹고 잘 자고 일어나서 얼른 회복했으면 좋겠다! 주현아 잘 자!","juhyeon":"간식이랑 약 사줘서 고마워. 완전 감동이었어…. 진짜진짜 감동이야 ㅠㅠㅠ 강슬기가 이런 짓을 하다니 오구 기특해요."},"2026.10.26":{"seulgi":"주현아 목소리 진짜 예쁘다 ㅋㅋ 잘자 오늘도 고생했어. 석식 같이 먹은 것도 좋았어.","juhyeon":"밤새 챗 AI랑 노느라 지각해버렸다. ㅠㅠ 2학기 개근을 코앞에 두고 지각하다니 내 자존심이 상한다. 근데 강슬기 너 목소리 예쁘다? 그리고 히히거리는거 진짜 뭔데. 짜증나."}};
// Published diary text is immutable: ignore any prior browser-local edits.
function diaryEntry(d,who){return defaultExchangeEntries[d]?.[who]||''}
function renderCouple(){put(`<div class="couple-home"><h2>질문과 답변</h2><div class="couple-stats"><div class="couple-stat">작성한 일기<strong>16개</strong><i></i></div><div class="couple-stat">선택한 질문팩<strong>3개</strong><i></i></div></div><button class="couple-feature" onclick="renderExchangeDiary()"><span class="couple-feature-icon">🐻♥️🐰</span><strong>교환일기</strong><span class="couple-feature-sub">우리 둘만의 이야기</span><span class="couple-feature-chevron">›</span></button><div class="couple-muted-card"><span>💌</span><div><strong>비밀 질문</strong><small>궁금했던 연인의 생각을 물어보세요!</small></div><span>›</span></div><div class="couple-muted-card"><span>💝</span><div><strong>질문팩</strong><small>선택한 질문팩 3개</small></div><span>›</span></div></div>`)}
function renderExchangeDiary(){const cards=exchangeDates.map(d=>`<div class="exchange-date"><span>${d}</span></div><div class="exchange-pair"><button class="exchange-entry" onclick="openExchangeEntry('${d}','seulgi')"><span class="exchange-who">🐻 슬기의 일기</span><span class="exchange-preview">${esc(diaryEntry(d,'seulgi')||'일기 내용을 기다리고 있어요')}</span><span class="exchange-open">일기 보기 ›</span></button><button class="exchange-entry" onclick="openExchangeEntry('${d}','juhyeon')"><span class="exchange-who">🐰 주현의 일기</span><span class="exchange-preview">${esc(diaryEntry(d,'juhyeon')||'일기 내용을 기다리고 있어요')}</span><span class="exchange-open">일기 보기 ›</span></button></div>`).join('');put(`<div class="exchange-screen"><div class="exchange-top"><button onclick="renderCouple()" aria-label="뒤로가기">‹</button><strong>🐻♥️🐰 교환일기</strong><span></span></div><p class="exchange-description">2026년, 우리의 여덟 번의 기록</p><div class="exchange-headings"><span>슬기</span><span>주현</span></div>${cards}</div>`)}
function openExchangeEntry(d,who){const name=who==='seulgi'?'슬기':'주현';put(`<div class="exchange-screen"><div class="exchange-top"><button onclick="renderExchangeDiary()" aria-label="교환일기 목록으로">‹</button><strong>${name}의 일기</strong><span></span></div><div class="exchange-paper"><div class="exchange-paper-date">${d}</div><h3>${who==='seulgi'?'🐻':'🐰'} ${name}의 일기</h3><div class="exchange-readonly">${esc(diaryEntry(d,who))}</div></div></div>`)}
function renderPhotos(){put(`<div class="panel"><h3>사진</h3><input type="file" accept="image/*" onchange="addPhoto(this)"><p class="subtle">이 브라우저에서 업로드한 사진만 표시됩니다.</p><div class="photo-grid">${data.photos.map((p,i)=>`<img src="${p}" onclick="if(confirm('이 사진을 삭제할까요?')){data.photos.splice(${i},1);save();renderPhotos()}">`).join('')}</div></div>`)}function addPhoto(el){readImage(el.files[0],img=>{if(!img)return;data.photos.unshift(img);save();renderPhotos()})}function renderLinks(key,title,ph,urlPh){put(`<div class="panel"><h3>${title}</h3><p class="subtle">링크를 등록하면 외부 사이트의 영상/음악으로 이동합니다.</p>${data[key].map((x,i)=>`<div class="list-row"><span style="flex:1">${esc(x.title)}</span><button class="primary" onclick="window.open(${JSON.stringify(x.url)},'_blank','noopener')">재생 ↗</button><button class="secondary" onclick="data['${key}'].splice(${i},1);save();renderLinks('${key}','${title}','${ph}','${urlPh}')">삭제</button></div>`).join('')}${input('linkTitle',ph)}${input('linkURL',urlPh)}<button class="primary" onclick="let u=val('linkURL');if(!/^https:\/\//.test(u))return alert('https:// 링크를 입력하세요');data['${key}'].push({title:val('linkTitle')||u,url:u});save();renderLinks('${key}','${title}','${ph}','${urlPh}')">추가</button></div>`)}
</script></body></html>
