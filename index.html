'use strict';const KEY='baejuhyeon_iphone_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}const initial={name:'배주현',instaId:'juhyeon',instaBio:'',posts:[],chats:[],notes:[{id:1,title:'새 메모',body:'여기에 주현이의 이야기를 적어 주세요.'}],events:[],photos:[],tracks:[],videos:[],coupleName:'',coupleDiary:[],ai:[],settings:{temp:'18',weather:'흐림',battery:'75'}};let data={...initial,...saved,settings:{...initial.settings,...(saved.settings||{})}};function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('저장 공간이 부족합니다. 사진 크기를 줄여 주세요.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}function updateClock(){const d=new Date();document.querySelector('#clock').textContent=fmt();document.querySelector('#locktime').textContent=fmt();document.querySelector('#weekday').textContent=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()];document.querySelector('#daynum').textContent=d.getDate();document.querySelector('#lockdate').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+['일요일','월요일','화요일','수요일','목요일','금요일','토요일'][d.getDay()];document.querySelector('#eventPreview').textContent=data.events.find(x=>x.date===d.toISOString().slice(0,10))?.title||'오늘 이벤트 없음';document.querySelector('#weatherTemp').textContent=data.settings.temp+'°';document.querySelector('#weatherDesc').textContent=data.settings.weather;document.querySelector('#battery').textContent=data.settings.battery}setInterval(updateClock,10000);updateClock();

ist.add('hidden');pin=''}else{document.querySelector('#pinmsg').textContent='암호가 틀렸습니다';setTimeout(()=>{pin='';updateDots();document.querySelector('#pinmsg').textContent='암호 입력'},600)}}}document.querySelector('#keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="key" onclick="digit('${n}')">${n}</button>`).join('');document.addEventListener('keydown',e=>{if(!document.querySelector('#pinpanel').classList.contains('hidden')&&/^\d$/.test(e.key))digit(e.key)});let startY=0;document.querySelector('#lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});document.querySelector('#lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>35)showPin()});function goHome(){if(!unlocked)return;appOpen='';stack=[];document.querySelector('#appscreen').classList.add('hidden');updateClock()}function goBack(){if(stack.length){let a=stack.pop();openApp(a,false)}else goHome()}function openApp(name,push=true){if(!unlocked)return;if(push&&appOpen&&appOpen!==name)stack.push(appOpen);appOpen=name;document.querySelector('#appscreen').classList.remove('hidden');document.querySelector('#appTitle').textContent=([...apps,...dockApps,['weather','날씨'],['search','검색']].find(x=>x[0]===name)||[name,name])[1];render(name)}const content=()=>document.querySelector('#content');function put(s){content().innerHTML=s}function input(id,placeholder,value='',type='text'){return `<input class="field" id="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}">`}function val(id){return document.getElementById(id)?.value||''}
function render(app){if(app==='kakao')return renderChats();if(app==='instagram')return renderInsta();if(app==='notes')return renderNotes();if(app==='calendar')return renderCalendar();if(app==='ai')return renderAI();if(app==='couple')return renderCouple();if(app==='photos')return renderPhotos();if(app==='camera')return put(`<div class="panel"><h3>카메라</h3><p>사진을 선택하거나 카메라로 촬영하면 사진 앱에 저장됩니다.</p><input type="file" accept="image/*" capture="environment" onchange="addPhoto(this)"></div>`);if(app==='weather')return put(`<div class="panel"><h3>서울특별시 날씨</h3><p>날씨 위젯의 값은 소설 설정용이며 실제 날씨 API와 연동되지 않습니다.</p>${input('wt','기온',data.settings.temp,'number')}${input('wd','날씨',data.settings.weather)}<button class="primary" onclick="data.settings.temp=val('wt');data.settings.weather=val('wd');save();updateClock();render('weather')">위젯 변경</button></div>`);if(app==='youtube')return renderLinks('videos','유튜브','영상 제목','유튜브 URL');if(app==='melon'||app==='music')return renderLinks('tracks','멜론 · 음악','노래 제목','음악 URL');if(app==='store')return put(`<div class="panel"><h3>App Store</h3><p>주현이의 아이폰에 설치된 앱 목록</p>${apps.map(a=>`<div class="list-row" onclick="openApp('${a[0]}')">${a[1]} <span style="margin-left:auto;color:#2688f3">열기</span></div>`).join('')}</div><div class="panel"><h3>폰 설정</h3><label>가상 배터리 잔량</label>${input('bat','75',data.settings.battery,'number')}<button class="primary" onclick="data.settings.battery=Math.min(100,Math.max(0,+val('bat')||0));save();updateClock()">저장</button></div>`);if(app==='search')return put(`<div class="panel">${input('query','앱 검색')}<button class="primary" onclick="let q=val('query');let a=[...apps,...dockApps].find(x=>x[1].toLowerCase().includes(q.toLowerCase()));if(a&&q)openApp(a[0]);else alert('앱을 찾을 수 없어요')">검색</button></div>`);if(app==='phone'||app==='messages'||app==='safari')return put(`<div class="panel"><h3>${app==='phone'?'전화':app==='messages'?'메시지':'Safari'}</h3><p>이 영역은 소설용 시뮬레이션입니다. 실제 전화·문자 발신 기능은 없습니다.</p>${app==='messages'?'<button class="primary" onclick="openApp(\'kakao\')">채팅룸 열기</button>':''}${app==='safari'?input('url','https://example.com')+'<button class="primary" onclick="let u=val(\'url\');if(/^https:\/\//i.test(u))window.open(u,\'_blank\',\'noopener\');else alert(\'https://로 시작하는 주소를 입력하세요\')">새 탭 열기</button>':''}</div>`)}
function renderChats(){put(`<div class="kakao-shell"><div class="kakao-heading"><h1>채팅</h1><span>⌕ &nbsp; ♧ &nbsp; ⚙</span></div><div class="kakao-tabs"><b>전체</b><span>안 읽음</span><span>오픈채팅</span></div><div class="chat-rows">${data.chats.map((c,i)=>`<button class="kakao-row" onclick="chatRoom(${i})"><div class="kakao-avatar">${c.avatar?`<img src="${esc(c.avatar)}">`:esc((c.name||'?').slice(0,1))}</div><div class="kakao-person"><strong>${esc(c.name)}</strong><span>${esc(c.messages?.at(-1)?.text||'대화 내용이 없습니다.')}</span></div><div class="kakao-meta"><small>${esc(c.time||'')}</small>${c.unread?`<em>${esc(c.unread)}</em>`:''}</div></button>`).join('')}</div><div class="kakao-bottom"><span>친구</span><b>채팅</b><span>오픈채팅</span><span>더보기</span></div></div>`)}
function chatRoom(i){const c=data.chats[i];put(`<div class="kakao-room"><div class="room-header"><button onclick="renderChats()">‹</button><strong>${esc(c.name)}</strong><span>⌕ &nbsp; ☰</span></div><div class="room-scroll">${(c.messages||[]).map((m,j)=>`<div class="room-message ${m.mine?'mine':''}">${m.mine?'':`<div class="room-avatar">${esc((c.name||'?').slice(0,1))}</div>`}<div class="room-msgcontent">${m.mine?'':`<span class="room-sender">${esc(c.name)}</span>`}<div class="room-bubblewrap"><div class="room-bubble">${esc(m.text)}</div><span class="room-time">${esc(m.time||'')}</span></div></div></div>`).join('')}</div><div class="room-compose"><span>＋</span><div class="fake-compose">메시지 입력</div><span>☺</span><span>＃</span></div></div>`);const sc=document.querySelector('.room-scroll');if(sc)sc.scrollTop=sc.scrollHeight}
function renameChat(i){const n=prompt('대화 상대',data.chats[i].name);if(n&&n.trim()){data.chats[i].name=n.trim();save();renderChats()}}
function sendChat(i,mine){const t=val('chatText').trim();if(!t)return;data.chats[i].messages.push({mine,text:t});save();chatRoom(i)}
function editMessage(i,j){const t=prompt('대화 수정',data.chats[i].messages[j].text);if(t===null)return;data.chats[i].messages[j].text=t;save();chatRoom(i)}
let instaTab='profile',instaPostIndex=0;
function renderInsta(){const ps=data.posts||[];const name=esc(data.instaId||'juhyeon');put(`<div class="insta-shell"><div class="insta-bar"><button onclick="instaTab='profile';renderInsta()">${instaTab==='post'?'‹':''}</button><strong>${instaTab==='post'?'게시물':name+'⌄'}</strong><span>＋ &nbsp; ☰</span></div>${instaTab==='profile'?`<div class="ig-profile"><div class="ig-profile-top"><div class="ig-avatar">${data.profileImage?`<img src="${esc(data.profileImage)}">`:'♡'}</div><div class="ig-stats"><div><b>${ps.length}</b><span>게시물</span></div><div><b>${esc(data.followers||'0')}</b><span>팔로워</span></div><div><b>${esc(data.following||'0')}</b><span>팔로잉</span></div></div></div><div class="ig-bio"><strong>${esc(data.name)}</strong><p>${esc(data.instaBio||'')}</p></div><div class="ig-actions"><button>프로필 편집</button><button>프로필 공유</button><button class="ig-person">♙</button></div><div class="ig-highlights">${(data.highlights||[]).map(h=>`<div onclick="openStory('${esc(h.title)}')"><div class="ig-highlight">${h.image?`<img src="${esc(h.image)}">`:'♡'}</div><span>${esc(h.title)}</span></div>`).join('')}</div></div><div class="ig-grid-tabs"><b>▦</b><span>▧</span><span>♧</span></div><div class="ig-grid">${ps.map((p,i)=>`<button onclick="instaPostIndex=${i};instaTab='post';renderInsta()">${p.image?`<img src="${esc(p.image)}">`:'<div class="ig-placeholder">♡</div>'}</button>`).join('')}</div>`:`<div class="ig-feed">${ps[instaPostIndex]?`<div class="ig-feed-author"><div class="ig-miniavatar">♡</div><strong>${name}</strong><span>···</span></div>${ps[instaPostIndex].image?`<img class="ig-feed-photo" src="${esc(ps[instaPostIndex].image)}">`:'<div class="ig-feed-photo ig-placeholder">♡</div>'}<div class="ig-reactions">♡ &nbsp; ♧ &nbsp; ➤ <span>▢</span></div><p><strong>${name}</strong> ${esc(ps[instaPostIndex].caption||'')}</p><div class="ig-comment">댓글 보기</div>`:'<p>게시물이 없습니다.</p>'}</div>`}<div class="ig-nav"><button onclick="instaTab='profile';renderInsta()">⌂</button><button onclick="instaTab='profile';renderInsta()">⌕</button><button>⊞</button><button>♡</button><button onclick="instaTab='profile';renderInsta()">◉</button></div></div>`)}
function openStory(title){alert(title+' 스토리 콘텐츠는 추후 추가할 수 있어요.')}
function editProfile(){let n=prompt('이름',data.name);if(n===null)return;let u=prompt('아이디',data.instaId);if(u===null)return;let b=prompt('소개글',data.instaBio);if(b===null)return;data.name=n;data.instaId=u;data.instaBio=b;save();renderInsta()}
function editPost(i){const n=prompt('게시물 설명 (비우면 삭제)',data.posts[i].caption);if(n===null)return;if(!n.trim())data.posts.splice(i,1);else data.posts[i].caption=n;save();renderInsta()}
function readImage(file,callback){if(!file)return callback('');if(file.size>2500000){alert('2.5MB 이하 이미지를 사용해 주세요.');return}const fr=new FileReader();fr.onload=()=>callback(fr.result);fr.readAsDataURL(file)}
function addPost(){readImage(document.querySelector('#postFile').files[0],img=>{data.posts.unshift({image:img,caption:val('caption')});save();renderInsta()})}
function renderNotes(){put(`<div class="panel"><h3>메모</h3><button class="primary" onclick="newNote()">＋ 새로운 메모</button></div>${data.notes.map((n,i)=>`<div class="note-row" onclick="openNote(${i})"><strong>${esc(n.title||'제목 없음')}</strong><div class="subtle">${esc(n.body.slice(0,75))}</div></div>`).join('')}`)}function newNote(){data.notes.unshift({id:Date.now(),title:'',body:''});save();openNote(0)}function openNote(i){let n=data.notes[i];put(`<div class="panel">${input('noteTitle','제목',n.title)}<textarea id="noteBody" class="textarea" style="min-height:48vh" placeholder="메모를 작성하세요">${esc(n.body)}</textarea><div class="tabs"><button class="primary" onclick="data.notes[${i}].title=val('noteTitle');data.notes[${i}].body=val('noteBody');save();renderNotes()">저장</button><button class="secondary" onclick="if(confirm('메모를 삭제할까요?')){data.notes.splice(${i},1);save();renderNotes()}">삭제</button><button class="secondary" onclick="renderNotes()">목록</button></div></div>`)}
function renderCalendar(){const date=new Date().toLocaleDateString('en-CA');put(`<div class="panel"><h3>일정</h3>${data.events.map((e,i)=>`<div class="list-row"><span><strong>${esc(e.title)}</strong><br><small>${esc(e.date)}</small></span><button class="secondary" style="margin-left:auto" onclick="data.events.splice(${i},1);save();updateClock();renderCalendar()">삭제</button></div>`).join('')}<h3>일정 추가</h3>${input('eventDate','날짜',date,'date')}${input('eventTitle','일정 이름')}<button class="primary" onclick="if(val('eventTitle')){data.events.push({date:val('eventDate'),title:val('eventTitle')});save();updateClock();renderCalendar()}">등록</button></div>`)}function renderAI(){put(`<div class="panel"><h3>Chat AI</h3><p class="subtle">소설용 가상 AI 채팅입니다. 실제 AI 서버는 연결되지 않습니다.</p>${data.ai.map((m,i)=>`<div class="chat-bubble ${m.mine?'mine':''}" style="background:${m.mine?'#ddf5ef':'#eee'};max-width:95%" onclick="editAI(${i})">${esc(m.text)}</div>`).join('')}<div class="composer">${input('aiText','메시지 입력')}<button class="primary" onclick="sendAI()">보내기</button></div><button class="secondary" onclick="data.ai=[];save();renderAI()">대화 지우기</button></div>`)}function sendAI(){let t=val('aiText').trim();if(!t)return;data.ai.push({mine:true,text:t},{mine:false,text:'이것은 배주현의 소설 속 Chat AI입니다. 아래 답변을 눌러서 원하는 내용으로 수정해 주세요.'});save();renderAI()}function editAI(i){let x=prompt('대화 수정',data.ai[i].text);if(x===null)return;if(x==='')data.ai.splice(i,1);else data.ai[i].text=x;save();renderAI()}
function renderCouple(){put(`<div class="panel" style="text-align:center"><div style="font-size:64px;color:#965ce8">♥</div><h3>아슬아슬</h3><p>배주현 ♥ ${esc(data.coupleName||'연인')}</p><button class="secondary" onclick="let n=prompt('연인 이름',data.coupleName);if(n!==null){data.coupleName=n;save();renderCouple()}">상대 이름 변경</button></div><div class="panel"><h3>둘만의 기록</h3>${data.coupleDiary.map((x,i)=>`<div class="list-row" onclick="let t=prompt('기록 수정 (비우면 삭제)',data.coupleDiary[${i}]);if(t!==null){if(!t)data.coupleDiary.splice(${i},1);else data.coupleDiary[${i}]=t;save();renderCouple()}">${esc(x)}</div>`).join('')}<textarea class="textarea" id="coupleText" placeholder="둘만의 추억을 남겨 주세요"></textarea><button class="primary" onclick="if(val('coupleText')){data.coupleDiary.unshift(val('coupleText'));save();renderCouple()}">기록 저장</button></div>`)}function renderPhotos(){put(`<div class="panel"><h3>사진</h3><input type="file" accept="image/*" onchange="addPhoto(this)"><p class="subtle">이 브라우저에서 업로드한 사진만 표시됩니다.</p><div class="photo-grid">${data.photos.map((p,i)=>`<img src="${p}" onclick="if(confirm('이 사진을 삭제할까요?')){data.photos.splice(${i},1);save();renderPhotos()}">`).join('')}</div></div>`)}function addPhoto(el){readImage(el.files[0],img=>{if(!img)return;data.photos.unshift(img);save();renderPhotos()})}function renderLinks(key,title,ph,urlPh){put(`<div class="panel"><h3>${title}</h3><p class="subtle">링크를 등록하면 외부 사이트의 영상/음악으로 이동합니다.</p>${data[key].map((x,i)=>`<div class="list-row"><span style="flex:1">${esc(x.title)}</span><button class="primary" onclick="window.open(${JSON.stringify(x.url)},'_blank','noopener')">재생 ↗</button><button class="secondary" onclick="data['${key}'].splice(${i},1);save();renderLinks('${key}','${title}','${ph}','${urlPh}')">삭제</button></div>`).join('')}${input('linkTitle',ph)}${input('linkURL',urlPh)}<button class="primary" onclick="let u=val('linkURL');if(!/^https:\/\//.test(u))return alert('https:// 링크를 입력하세요');data['${key}'].push({title:val('linkTitle')||u,url:u});save();renderLinks('${key}','${title}','${ph}','${urlPh}')">추가</button></div>`)}
</script></body></html>
