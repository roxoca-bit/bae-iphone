elector('#lock').classList.add('hidden');pin=''}else{document.querySelector('#pinmsg').textContent='암호가 틀렸습니다';setTimeout(()=>{pin='';updateDots();document.querySelector('#pinmsg').textContent='암호 입력'},600)}}}document.querySelector('#keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="key" onclick="digit('${n}')">${n}</button>`).join('');document.addEventListener('keydown',e=>{if(!document.querySelector('#pinpanel').classList.contains('hidden')&&/^\d$/.test(e.key))digit(e.key)});let startY=0;document.querySelector('#lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});document.querySelector('#lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>35)showPin()});function goHome(){if(!unlocked)return;appOpen='';stack=[];document.querySelector('#appscreen').classList.add('hidden');updateClock()}function goBack(){if(stack.length){let a=stack.pop();openApp(a,false)}else goHome()}function openApp(name,push=true){if(!unlocked)return;if(push&&appOpen&&appOpen!==name)stack.push(appOpen);appOpen=name;document.querySelector('#appscreen').classList.remove('hidden');document.querySelector('#appTitle').textContent=([...apps,...dockApps,['weather','날씨'],['search','검색']].find(x=>x[0]===name)||[name,name])[1];render(name)}const content=()=>document.querySelector('#content');function put(s){content().innerHTML=s}function input(id,placeholder,value='',type='text'){return `<input class="field" id="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}">`}function val(id){return document.getElementById(id)?.value||''}

function readImage(file,callback){if(!file)return callback('');if(file.size>2500000){alert('2.5MB 이하 이미지를 사용해 주세요.');return}const fr=new FileReader();fr.onload=()=>callback(fr.result);fr.readAsDataURL(file)}
function addPost(){readImage(document.querySelector('#postFile').files[0],img=>{data.posts.unshift({image:img,caption:val('caption')});save();renderInsta()})}
function renderNotes(){put(`<div class="panel"><h3>메모</h3><button class="primary" onclick="newNote()">＋ 새로운 메모</button></div>${data.notes.map((n,i)=>`<div class="note-row" onclick="openNote(${i})"><strong>${esc(n.title||'제목 없음')}</strong><div class="subtle">${esc(n.body.slice(0,75))}</div></div>`).join('')}`)}function newNote(){data.notes.unshift({id:Date.now(),title:'',body:''});save();openNote(0)}function openNote(i){let n=data.notes[i];put(`<div class="panel">${input('noteTitle','제목',n.title)}<textarea id="noteBody" class="textarea" style="min-height:48vh" placeholder="메모를 작성하세요">${esc(n.body)}</textarea><div class="tabs"><button class="primary" onclick="data.notes[${i}].title=val('noteTitle');data.notes[${i}].body=val('noteBody');save();renderNotes()">저장</button><button class="secondary" onclick="if(confirm('메모를 삭제할까요?')){data.notes.splice(${i},1);save();renderNotes()}">삭제</button><button class="secondary" onclick="renderNotes()">목록</button></div></div>`)}
function renderCalendar(){const date=new Date().toLocaleDateString('en-CA');put(`<div class="panel"><h3>일정</h3>${data.events.map((e,i)=>`<div class="list-row"><span><strong>${esc(e.title)}</strong><br><small>${esc(e.date)}</small></span><button class="secondary" style="margin-left:auto" onclick="data.events.splice(${i},1);save();updateClock();renderCalendar()">삭제</button></div>`).join('')}<h3>일정 추가</h3>${input('eventDate','날짜',date,'date')}${input('eventTitle','일정 이름')}<button class="primary" onclick="if(val('eventTitle')){data.events.push({date:val('eventDate'),title:val('eventTitle')});save();updateClock();renderCalendar()}">등록</button></div>`)}function renderAI(){put(`<div class="panel"><h3>Chat AI</h3><p class="subtle">소설용 가상 AI 채팅입니다. 실제 AI 서버는 연결되지 않습니다.</p>${data.ai.map((m,i)=>`<div class="chat-bubble ${m.mine?'mine':''}" style="background:${m.mine?'#ddf5ef':'#eee'};max-width:95%" onclick="editAI(${i})">${esc(m.text)}</div>`).join('')}<div class="composer">${input('aiText','메시지 입력')}<button class="primary" onclick="sendAI()">보내기</button></div><button class="secondary" onclick="data.ai=[];save();renderAI()">대화 지우기</button></div>`)}function sendAI(){let t=val('aiText').trim();if(!t)return;data.ai.push({mine:true,text:t},{mine:false,text:'이것은 배주현의 소설 속 Chat AI입니다. 아래 답변을 눌러서 원하는 내용으로 수정해 주세요.'});save();renderAI()}function editAI(i){let x=prompt('대화 수정',data.ai[i].text);if(x===null)return;if(x==='')data.ai.splice(i,1);else data.ai[i].text=x;save();renderAI()}
function renderCouple(){put(`<div class="panel" style="text-align:center"><div style="font-size:64px;color:#965ce8">♥</div><h3>아슬아슬</h3><p>배주현 ♥ ${esc(data.coupleName||'연인')}</p><button class="secondary" onclick="let n=prompt('연인 이름',data.coupleName);if(n!==null){data.coupleName=n;save();renderCouple()}">상대 이름 변경</button></div><div class="panel"><h3>둘만의 기록</h3>${data.coupleDiary.map((x,i)=>`<div class="list-row" onclick="let t=prompt('기록 수정 (비우면 삭제)',data.coupleDiary[${i}]);if(t!==null){if(!t)data.coupleDiary.splice(${i},1);else data.coupleDiary[${i}]=t;save();renderCouple()}">${esc(x)}</div>`).join('')}<textarea class="textarea" id="coupleText" placeholder="둘만의 추억을 남겨 주세요"></textarea><button class="primary" onclick="if(val('coupleText')){data.coupleDiary.unshift(val('coupleText'));save();renderCouple()}">기록 저장</button></div>`)}function renderPhotos(){put(`<div class="panel"><h3>사진</h3><input type="file" accept="image/*" onchange="addPhoto(this)"><p class="subtle">이 브라우저에서 업로드한 사진만 표시됩니다.</p><div class="photo-grid">${data.photos.map((p,i)=>`<img src="${p}" onclick="if(confirm('이 사진을 삭제할까요?')){data.photos.splice(${i},1);save();renderPhotos()}">`).join('')}</div></div>`)}function addPhoto(el){readImage(el.files[0],img=>{if(!img)return;data.photos.unshift(img);save();renderPhotos()})}function renderLinks(key,title,ph,urlPh){put(`<div class="panel"><h3>${title}</h3><p class="subtle">링크를 등록하면 외부 사이트의 영상/음악으로 이동합니다.</p>${data[key].map((x,i)=>`<div class="list-row"><span style="flex:1">${esc(x.title)}</span><button class="primary" onclick="window.open(${JSON.stringify(x.url)},'_blank','noopener')">재생 ↗</button><button class="secondary" onclick="data['${key}'].splice(${i},1);save();renderLinks('${key}','${title}','${ph}','${urlPh}')">삭제</button></div>`).join('')}${input('linkTitle',ph)}${input('linkURL',urlPh)}<button class="primary" onclick="let u=val('linkURL');if(!/^https:\/\//.test(u))return alert('https:// 링크를 입력하세요');data['${key}'].push({title:val('linkTitle')||u,url:u});save();renderLinks('${key}','${title}','${ph}','${urlPh}')">추가</button></div>`)}
</script></body></html>
